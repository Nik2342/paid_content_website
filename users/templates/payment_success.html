{% extends "base.html" %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>

                    <h2>Оплата прошла успешно! 🎉</h2>
                    <p class="text-muted">Ваша подписка активирована</p>

                    <div class="alert alert-success">
                        <strong>Теперь вам доступен весь премиум контент!</strong>
                    </div>

                    <div class="d-grid gap-2">
                        <a href="{% url 'posts:posts_list' %}" class="btn btn-primary">
                            Перейти к постам
                        </a>
                        <a href="{% url 'users:subscribe' %}" class="btn btn-outline-secondary">
                            Проверить статус подписки
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Автоматически проверяем статус подписки
setTimeout(() => {
    window.location.reload();
}, 3000);
</script>
{% endblock %}
